name: Dependency audit

on:
  push:
    branches:
      - main
      - fix/post-merge-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture current audit
        run: npm audit --json > audit-before-fix.json || true
      - name: Apply available package-lock fixes
        run: npm audit fix --package-lock-only || true
      - name: Verify remaining vulnerabilities
        run: |
          npm audit --json > audit-after-fix.json || true
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("audit-after-fix.json", "utf8"));
          const vulns = report.metadata?.vulnerabilities || {};
          const high = Number(vulns.high || 0);
          const critical = Number(vulns.critical || 0);
          console.log({ high, critical, total: vulns.total || 0 });
          process.exit(high + critical > 0 ? 1 : 0);
          NODE
      - name: Upload audit and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-fix
          path: |
            audit-before-fix.json
            audit-after-fix.json
            package-lock.json
